# hardware.yaml — GPU runner 子进程的**拓扑**定义（哪些 group、每个 group 用哪些卡）
#
# ⚠️ 这不是"模型装在哪张卡"的真相源，也不是硬绑定。模型放置的优先级是：
#   1. 每模型 gpu 覆盖 —— Postgres 表 model_runtime_overrides（引擎库右键设，
#      运行时可改）。设了就用它，这是唯一的"钉死"手段。
#   2. 没覆盖 → models.yaml 的静态 gpu 字段。
#   3. 还没有 → auto：GPUAllocator.get_best_gpu() 按 nvidia-smi 实时空闲显存挑
#      "装得下的里面最空的"（带在途预留，防并发 load 撞同一张卡）。
# 本文件的 groups[].gpus 只对 auto 起**软偏好**作用（runner 的 preferred_gpus）：
# 先在组内选，组内都装不下就 spill 到全局并打 warning（gpu_allocator.py:180）。
# 所以下面每个 group 的卡是"倾向"，不是"限定"。
#
# 另外：只有走 image / tts runner 子进程的节点受本文件约束。LLM（直连 vLLM）、
# ASR（MOSS/SGLang 独立 systemd 微服务，自带 CUDA_VISIBLE_DEVICES）、向量嵌入
# 都不经过这里，它们的卡各自决定。
#
# 当前 = Pro 6000 + Pro 5000 两卡布局（2026-09-20，两张 3090 已拔除）。
# 索引 = PCI_BUS_ID（与 nvidia-smi 一致）:
#   GPU 0: RTX PRO 5000 72GB Blackwell (01:00)  71.7 GiB 实测
#          → 全部推理服务:LLM / ASR / embedding / OCR
#   GPU 1: RTX PRO 6000 96GB Blackwell (99:00)  95.6 GiB 实测
#          → ComfyUI sidecar 独占（unit 用 UUID 钉卡，见 nous-engine-comfyui.service）
#
# **没有多卡 group** —— 两张卡型号不同，validate_gpu_group 对异构组直接报错
# （topology.py:269「GPU 组必须同型号」）。想做张量并行必须买同型号第二张。
#
# 显示输出走主板 ASPEED BMC（9c:00.0），不占用任何 N 卡。
#
# 字段语义：
#   id      group 唯一标识，runner / scheduler 用它寻址
#   gpus    该 group auto 选卡时**优先**考虑的 GPU index 列表（cuda:N 的 N）；
#           组内装不下会 spill 到全局，不是硬限制
#   nvlink  组内 GPU 是否 NVLink 互联；vLLM tp 模型强约束 nvlink:true
#   role    image / llm / tts —— 节点按 role 找 group
#   vram_gb 整个 group 的合计 VRAM
#
# V1.5 manual-only：不解析 nvidia-smi topo -m，无 detection 字段。
groups:
  - id: llm
    gpus: [0]              # Pro 5000 72GB —— LLM/ASR/embedding/OCR 全在这张
    nvlink: false
    role: llm
    vram_gb: 72

  - id: image
    gpus: [1]              # Pro 6000 96GB —— 与 ComfyUI 共用(两者都非常驻,按需错峰)
    nvlink: false
    role: image
    vram_gb: 96

  - id: tts
    gpus: [0]              # Pro 5000;TTS 模型最大 7.8GiB,与推理服务共卡
    nvlink: false
    role: tts
    vram_gb: 72
