# qwen3_embedding_8b — Embedding
# 一模型一文件(configs/models.d/);改此模型只动本文件。
adapter: src.services.inference.llm_vllm.VLLMAdapter
id: qwen3_embedding_8b
paths:
  main: embedding/Qwen3-Embedding-8B
type: embedding
# 2026-09-05:17500 低报了实际占用。真实预留的优先级是
#   overlay `vram_budget` > 本文件 `params.gpu_memory_utilization` > adapter 自动公式
# (`llm_vllm.py` resolve_vram_utilization)。线上覆盖行钉的是绝对 22G,这里对齐它,
# 让 tests/test_resident_capacity.py 的常驻账按真实占用算。
vram_mb: 22000
# Pro 5000(72G)。2026-09-20 两张 3090 拔除、Pro 6000 交给 ComfyUI 独占后,推理服务
# 统一落 GPU 0。(2026-09-05 spec §10 当时写的是「钉 Pro 6000 并常驻」,硬件已变;
# 那条 spec 真正要解决的是**别走自动选卡** —— 此前无钉卡时它反复落到 3090 又被 LRU
# 驱逐,gpu_monitor 日志 "Auto-evicted model qwen3_embedding_8b from GPU 2"。
# 显式钉卡这一点仍然照办,只是钉的卡换了。)
gpu: 0
# **不再常驻**(2026-09-20,用户决定)。原先的 `resident: true` 是 Pro 6000 时代的配置,
# 线上 DB override 早已把它压成非常驻、与 yaml 分叉;这里删掉让两边一致。
# 留着是颗定时炸弹:override 一旦被清,它会变成第 4 个常驻,而 test_resident_capacity
# 会按当时 yaml 的 gpu: 1 去核 96GiB 的容量,根本发现不了冲突。
# 现在 GPU 0 的常驻名额给了 ASR + qwen3.8 + WeMM-4B(共 57.9 GiB);embedding 建库
# 主力是 WeMM-4B,本模型退为按需加载的备用档。
ttl_seconds: 3600
params:
  vllm_runner: pooling
  max_model_len: 8192
  # 比例是每卡占**总量**,换卡必须重算。历史:0.3 曾是按 24G 卡的直觉写的,在 96G 的
  # Pro 6000 上 = 28.8G,比预算大一截(跟 MOSS 的 mem_fraction_static 同一类 bug,
  # 见 PR #710),于是收到 0.22 × 95 ≈ 20.9G 与绝对 22G 对齐。
  # 2026-09-20 换到 Pro 5000,**保持绝对预算不变**做等价换算:20.9 / 71.12 ≈ 0.30。
  # (巧合:数字又回到 0.3,但含义完全不同 —— 这次是 71.12 GiB 的 30%,不是 24G 的直觉。)
  # 这是换算不是重新标定,真机未在 Pro 5000 上复测。
  gpu_memory_utilization: 0.30
