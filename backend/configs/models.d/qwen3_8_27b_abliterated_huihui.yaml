# qwen3_8_27b_abliterated_huihui — LLM(视觉语言,破限版,BF16 未量化)
# 一模型一文件(configs/models.d/);改此模型只动本文件。
#
# 模型:huihui-ai/Huihui-Qwen3.8-27B-abliterated(latest,2026-09-19 从外置盘导入)
#   - 基座 Qwen3.8-27B(`Qwen3_5ForConditionalGeneration`,64 层里 16 层全注意力
#     + 48 层 Gated DeltaNet 线性注意力,`full_attention_interval: 4`;hidden 5120,
#     24 注意力头 / 4 KV 头;原生视觉塔 333 个权重)。
#   - 破限:huihui-ai 的 abliteration,**BF16 未量化**(config.json 无 quantization_config)。
#   - 权重 **51.75 GiB**(盘上实测,与 index 的 total_size 一致,完整)。
#
# **这是四个 3.8 变体里最吃显存的一个**,BF16 不量化 = 权重就是 AWQ 版(19.32)的 2.7 倍。
# 与另外三个互为替代,不能并存 —— 见下面的显存账。
adapter: src.services.inference.llm_vllm.VLLMAdapter
id: qwen3_8_27b_abliterated_huihui
paths:
  main: llm/Qwen3.8-27B-abliterated-Huihui
type: llm
# Pro 5000(72G)。Pro 6000 由 ComfyUI 独占,LLM 不上那张(CLAUDE.md 的用户硬决定)。
gpu: 0
# **不常驻,按需加载,而且加载前必须腾卡**。实测账(2026-09-21,Pro 5000 可见 71.12 GiB):
#   三常驻(MOSS ASR 8.7 + AWQ 23.2 + WeMM-4B 12.8)稳态 45.9 GiB,只剩 25.2 GiB。
#   本模型光权重 51.75 GiB —— 连 WeMM-4B 一起卸掉(剩 62.4 GiB)才装得下,
#   **且只剩约 5 GiB 余量,已经贴着 gpu_monitor 的 DEFAULT_RESERVED_GB=4.0**。
# 实际操作:要用它,先卸 AWQ + WeMM-4B,只留 MOSS ASR。
ttl_seconds: 3600
# 2026-09-21 真机标定。**测量在空闲的 Pro 6000 上做的**(Pro 5000 被常驻占满,
# 腾不出 57 GiB)。Pro 6000 可见 94.97 GiB,util 0.60:
#   权重+non-torch 51.69 + 峰值激活 2.05 + KV 3.24 = **56.98 GiB = 预算** ✓
#   (CUDAGraph 另计 0.16 GiB,不在等式里)
#   KV 3.24 GiB = 45,738 tokens,32768 上下文下并发仅 **1.40x**;稳态 56970 MiB;
#   加载 140.2s。
# 与 qwen3_8_27b_uncensored_jc **实测数字完全一致**(同基座,1199 个张量同样多)——
# 两者只留一个即可;那份带独立 model-mtp.safetensors,想试 MTP 就留那份。
#
# ⚠️ **换算,不是照抄**:绝对预算 56.98 GiB 落到 Pro 5000(可见 71.12 GiB)
# = 56.98 / 71.12 = **0.80**。别把上面那个 0.60 抄过来。
#
# ⚠️ **落到 Pro 5000 后余量极小**:57.06(含 CUDAGraph)+ MOSS ASR 8.68 = 65.74 GiB,
# 卡 71.69 → 只剩 ~5.9 GiB。高于 DEFAULT_RESERVED_GB=4.0 但很紧,
# **且必须先卸掉 AWQ 与 WeMM-4B**。起不来就往下调 util 换小 KV;
# **别往上调**,超过约 0.94 会触发看门狗驱逐(见 AWQ yaml 那条与卡型无关的上界机制)。
vram_mb: 58300
params:
  # 262144 是原生上限,但这个变体几乎没有 KV 预算余量,32768 已是乐观值。
  # 往上调必须同步抬 util,而 util 已经贴顶 —— 实际上这个 BF16 变体注定是短上下文用法。
  max_model_len: 32768
  # 比例是**每卡占总量**。0.80 是四个 3.8 变体里最高的,因为 BF16 不量化。
  gpu_memory_utilization: 0.80
  vllm_args:
    # 思考内容分离到 `reasoning_content`,**不是关思考**(同 AWQ 版)。
    reasoning-parser: qwen3
    enable-auto-tool-choice: true
    tool-call-parser: qwen3_xml
    # ⚠️ 未开 speculative-config(MTP):index 里有 15 个 mtp 权重键但无独立
    # model-mtp.safetensors,能否吃到未验证;且这个变体显存已贴顶,草稿 KV 加不起。
