# moss_transcribe_diarize — ASR(MOSS-Transcribe-Diarize,SGLang Omni 微服务)
# 一模型一文件(configs/models.d/);改此模型只动本文件。
# Arc 2(spec 2026-07-20-moss-asr-sglang-serving-design.md §7):从独立 systemd unit 改由
# ModelManager 起 `sgl-omni serve` 子进程统一纳管。resident 常驻(行为等同旧 systemd 版)。
adapter: src.services.inference.asr_sglang.SGLangOmniAdapter
id: moss_transcribe_diarize
type: asr
paths:
  main: speech/MOSS-Transcribe-Diarize
resident: true
# 2026-09-20 Pro 5000(71.7GB)真机实测:mem_fraction_static 0.11 起来后
# nvidia-smi 实占 9668MiB,超出 7000-9000MiB 目标区间,回调到 0.10 后实占稳定在
# 8996MiB(pid 用 infra/moss-asr/.venv 起,落在 gpu_uuid f4334111 那张卡)。转写同一段
# 7.7min 双人播客(podcast_16k.wav):53 段,两轮 wall 分别 8.08s / 7.63s(sm_120 无
# sm_86 的 JIT 冷启问题,两轮都热)。vram_mb 按实占取整记 9000。
# 该比例是「占整卡容量的比例」,换卡必须同步改 —— 见 infra/moss-asr/moss_config.yaml。
# (历史:在 24GB 3090 上是 0.5 × 24 = 12GB,SPIKE 实测稳态 13.4GB,故当时记 13000;
# 在 96GB Pro 6000 上是 0.15 × 96 ≈ 14.4GB,记 15000。)
vram_mb: 9000
# index0 = Pro 5000(nvidia-smi PCI 序,= 下面 gpu_uuid)。设 gpu 走「配置固定卡」路径:
# 不经 allocator(否则按 free 显存可能选到别的卡),ModelManager 记账落这张卡。
# 真正的钉卡防线是子进程 env 的 gpu_uuid(见下)—— 即便 index 漂移,UUID 仍保子进程只见这张卡。
#
# 2026-09-20:机器从三卡(Pro 6000 + 2×RTX 3090)换成两卡(Pro 6000 + Pro 5000),两张
# 3090 已物理拔除。MOSS 从 Pro 6000 让给 LLM/embedding,自己搬到新到的 Pro 5000(72GB)——
# 单卡够用,MOSS 本就不能跨卡做 tp(见下)。
# (历史:2026-09-05 从 3090(index 0)搬到 Pro 6000,是因为两张 3090 当时让给 LLM 做
# tp=2;MOSS 自己不能跨卡 —— 上游 sglang-omni 的 tp 只认 thinker/image-encoder 这类
# stage 名,MOSS-TD 的 stage 叫 asr,且它的 stage factory 不接 tp_rank/tp_size/nccl_port,
# 硬配 tp 会在拉 rank 进程时 TypeError(2026-09-05 实测)。)
gpu: 0
params:
  # 子进程 CUDA_VISIBLE_DEVICES 钉 Pro 5000 的 UUID。UUID 不随槽位/torch FASTEST_FIRST
  # 枚举变;adapter 用它而非 device index 设 CUDA_VISIBLE_DEVICES(见 asr_sglang.py
  # docstring 差异点 2)。
  gpu_uuid: GPU-f4334111-b8d2-4df3-ea0f-6177698f8ce9
