# qwen3_8_27b_uncensored_fp8 — LLM(视觉语言,破限版,FP8)
# 一模型一文件(configs/models.d/);改此模型只动本文件。
#
# 模型:orcarouter/Qwen3.8-27B-Uncensored-FP8(2026-09-19 从外置盘导入)
#   - 基座 Qwen3.8-27B(`Qwen3_5ForConditionalGeneration`,混合注意力:64 层里
#     16 层全注意力 + 48 层 Gated DeltaNet 线性注意力,`full_attention_interval: 4`;
#     hidden 5120,24 注意力头 / 4 KV 头;原生视觉塔 333 个权重)。
#   - 量化:**FP8 e4m3**,`activation_scheme: dynamic`,`weight_block_size: [128,128]`。
#     不是 AWQ/compressed-tensors —— 与 qwen3_8_27b_abliterated_awq 不同一条路子,
#     Blackwell 原生支持 FP8,不需要额外 kernel。
#   - 权重 **28.75 GiB**(盘上实测,index 的 total_size 与文件和一致,完整)。
#
# 与目录里另外三个 3.8 的关系:四个是**同一基座的不同破限/量化变体,互为替代**,
# 不是并存项 —— 见下面 util 那节的显存账。
adapter: src.services.inference.llm_vllm.VLLMAdapter
id: qwen3_8_27b_uncensored_fp8
paths:
  main: llm/Qwen3.8-27B-Uncensored-FP8-orcarouter
type: llm
# Pro 5000(72G)。2026-09-20 两卡布局后推理服务统一落 GPU 0;
# Pro 6000 由 ComfyUI 独占,LLM 不上那张(CLAUDE.md 的用户硬决定)。
gpu: 0
# **不常驻,按需加载**。常驻名额已给 qwen3_8_27b_abliterated_awq(AWQ, 25500 MiB)。
# 实测账(2026-09-21):Pro 5000 可见 71.12 GiB,现有三常驻(MOSS ASR 8.7 + AWQ 23.2
# + WeMM-4B 12.8)稳态占 45.9 GiB,只剩 25.2 GiB —— 本模型光权重就 28.75 GiB,
# **装不进常驻之外的余量**。要用它必须先卸掉 AWQ 那个(两者是替代关系)。
ttl_seconds: 3600
# 2026-09-21 真机标定。**测量在空闲的 Pro 6000 上做的**(Pro 5000 被常驻占满,
# 腾不出 34 GiB;ComfyUI 当时 queue 空)。Pro 6000 可见 94.97 GiB,util 0.36:
#   权重+non-torch 29.09 + 峰值激活 2.02 + KV 3.08 = **34.19 GiB = 预算** ✓
#   (CUDAGraph 另计 0.16 GiB,不在这个等式里 —— 见 AWQ 那份 yaml 的说明)
#   KV 3.08 GiB = 43,690 tokens,32768 上下文下并发仅 **1.33x**;稳态 33562 MiB;
#   加载 130.2s(含 35.2s 编译)。
#
# ⚠️ **换算,不是照抄**:util 是「占该卡总量」的比例。绝对预算 34.19 GiB 落到
# Pro 5000(可见 71.12 GiB)= 34.19 / 71.12 = **0.48**。别把上面那个 0.36 抄过来。
vram_mb: 35000
params:
  # 262144 是模型原生上限(text_config.max_position_embeddings)。
  # 混合线性注意力 → KV 仅 ~64 KiB/token,但 util 0.48 的预算扣掉权重后 KV 不多,
  # 32768 与 AWQ 版对齐。往上调必须**同步抬 util**,否则 KV 不够直接起不来。
  # 262144 是原生上限。实测 util 0.48 下 KV 只有 ~3.0 GiB ≈ 43,000 tokens,
  # 32768 的上下文**并发只有 1.33x** —— 单路够用,并发要更高就得抬 util,
  # 而 Pro 5000 上抬 util 得先有余量(见上面的腾卡说明)。往上调 max_model_len
  # 必须同步抬 util,否则 KV 不够直接起不来。
  max_model_len: 32768
  # 比例是**每卡占总量**,不是占空闲、不是绝对值。换卡必须重算。
  # 0.48 = 34.14 GiB @ Pro 5000(71.12 可见),对应实测的 34.19 GiB 绝对预算。
  gpu_memory_utilization: 0.48
  vllm_args:
    # 思考内容分离到 `reasoning_content`,**不是关思考**(同 AWQ 版的处理)。
    reasoning-parser: qwen3
    # 工具调用:nous-app 的 agent_runner 会传 tools。qwen3_xml = Qwen3.5+ 的格式。
    enable-auto-tool-choice: true
    tool-call-parser: qwen3_xml
    # ⚠️ **没有开 speculative-config(MTP)**。分片 index 里确实有 22 个 mtp 权重键,
    # 但本变体没有独立的 model-mtp.safetensors,vLLM 能否吃到未验证。
    # 先把模型跑通再单独验证 MTP(AWQ 版实测 83 → 111 tok/s,值得后续试)。
