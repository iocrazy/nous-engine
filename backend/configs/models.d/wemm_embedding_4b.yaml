# wemm_embedding_4b — 多模态 Embedding(文本 / 图像 / 视频 → 2560 维,MRL)
# 一模型一文件(configs/models.d/);改此模型只动本文件。
#
# tencent/WeMM-Embedding-4B,base = Qwen3.5-4B(混合线性注意力 + vision tower)。
# 架构 Qwen3_5ForConditionalGeneration —— 本机 vLLM 0.28.0 已原生注册,**不走
# trust_remote_code**(仓库里的 modeling_wemm_embedding.py 是给 transformers /
# sentence-transformers 路径用的,vLLM 用不到)。
adapter: src.services.inference.llm_vllm.VLLMAdapter
id: wemm_embedding_4b
paths:
  main: embedding/WeMM-Embedding-4B
type: embedding
# util 预算 = 权重 8.81 + 峰值激活 11.95 + KV 3.43(78,941 tokens) = 24.19 GiB
# ≈ 0.34 × 71.12 = 24.18 ✓
# **CUDAGraph 的 0.08 GiB 不在这个等式里** —— 它是 util 预算之外的另一块预留
# (2026-09-20 五次测量都验证了这一点,别把它加进来凑)。
# 卡上实占 ≈ 24.27 GiB;Pro 5000 单卡 71.7 GiB 充足。
# 原先 0.30 × 95.6GiB ≈ 28.7GiB(Pro 6000 口径),改单卡需重算。
#
# **别按权重大小猜这个数**(2026-09-11 踩过):权重只占 8.81 GiB(盘上 10.35GB,pooling 用不到
# lm_head/MTP 头,所以显存里更少),但 vLLM 起来时要按 max_num_seqs × max_model_len
# **带多模态 dummy 输入**跑一遍 profiling,视觉塔的激活峰值把自身消耗顶到 ~21GiB。
# util 给 0.15 直接 `No available memory for the cache blocks`(Available KV cache memory: -6.78GiB)。
vram_mb: 24800
# Pro 5000(72G)。2026-09-20 两张 3090 拔除后,推理服务统一落 GPU 0。
# 单卡足够:跨卡 tp 对 embedding(短序列、无生成)只多一笔 all-reduce,不划算。
gpu: 0
# 2026-09-15 设为常驻:三档 WeMM 里选 4B 做建库主力(MMEB-v2 79.2 vs 2B 77.9 / 9B 80.6;
# MMEB-v3 58.2 vs 56.0 / 59.5 —— 4B 是效果与显存的拐点)。
#
# **为什么必须常驻**:数据面不懒加载(spec 2026-09-05 engine-app-boundary),模型没在显存里
# 就即刻 503 `model_not_ready`,不会在请求路径上加载。服务建好了、key 也授权了,只要模型
# 没加载照样调不通 —— `resident: true` 是**唯一**的常驻手段。
# 原先的 `ttl_seconds: 3600` 一并删掉:常驻模型不会被 evict_lru 驱逐(只驱逐非 resident 的),
# ttl 对它是死字段,留着会让人以为它会闲置卸载。2b / 9b 仍保留 ttl,按需加载。
#
# 常驻集合的容量自洽由 tests/test_resident_capacity.py 在 CI 兜(读 yaml 的 vram_mb,
# 按落卡汇总必须放得进 hardware.yaml 容量减 DEFAULT_RESERVED_GB)。
# GPU 0 现有常驻:MOSS ASR 9000 + qwen3.8 25500 + 本模型 24800 = 59300 MiB,上限 72-4=68G。
resident: true
params:
  # pooling runner 必须显式给,否则 vLLM 按生成模型起,/v1/embeddings 404。
  vllm_runner: pooling
  max_model_len: 8192
  # embedding 是短请求、无生成,16 路并发足够;这个值直接决定上面说的 profiling 峰值,
  # 调大会把自身消耗顶上去,要同步抬 gpu_memory_utilization。
  max_num_seqs: 16
  # 比例是**每卡占总量**,不是占空闲。Pro 5000 上 0.34 = 24.18 GiB。0.34 是首测即成功、
  # 未继续下探,真地板**可能更低** —— 降级时需谨慎验证。
  gpu_memory_utilization: 0.34
  vllm_args:
    # 覆盖适配器自动加的 `{"image":4}`(它按生成式 VL 模型的习惯给的)。embedding 一次
    # 只编码一个对象,4 张图纯属把 profiling 峰值抬高。`--limit-mm-per-prompt` 在
    # VLLM_ADAPTER_OWNED_FLAGS 里,所以这里是干净覆盖,不会出现两次同名 flag。
    limit-mm-per-prompt: {"image": 1, "video": 1}
    # 官方 vLLM serve 命令的一部分。这个模板在末尾追加 `<embedding>` token;
    # 不给的话 vLLM 回退到 tokenizer_config 里的**生成用**模板,messages 形式请求
    # 算出的向量与官方 SentenceTransformer 对不上。
    # `{model_dir}` 由 llm_vllm.substitute_model_dir 在 _build_command 里展开成
    # 已解析的绝对模型目录 —— yaml 里不写死 LOCAL_MODELS_PATH。
    chat-template: "{model_dir}/embedding_chat_template.jinja"
