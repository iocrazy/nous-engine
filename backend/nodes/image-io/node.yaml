name: image-io
version: "1.0"
description: "图像 I/O 节点 — 图像输入(上传)等通用图像来源/汇,喂下游 image 类型节点(调色/合并/对比/落地)"
author: "nous-engine"

# image_input:把上传的图(base64 data URI)落盘签 URL,产出 image 端口 →
# 接下游 image 类型节点(调色/合并/对比/image_output 落地等)。inline 节点(主进程,CPU:
# 解码+写盘),不吃 GPU。补齐「现有图作来源」的能力 —— image 端口协议与 image_output sink 对齐。

nodes:

  image_input:
    label: "图像输入"
    category: image
    badge: Input
    badgeColor: "var(--info)"
    inputs: []
    outputs:
      # type: image —— 与 image_output sink / image-color-match 等节点同类型,
      # UI 可连(sourceType===targetType)。
      - { id: image, type: image, label: 图像 }
    widgets:
      # 上传图 → base64 data URI 存进 node.data.image;executor 落盘签 URL。
      - { name: image, label: "图像", widget: image_upload }

  # 参考图合并(多参考编辑)—— 两路 image → 一路 image(逗号串签名 URL)。可串联(输出接下一个
  # 合并的 参考图A)扩到 3+ 张。原下游消费方(flux2_ksampler→runner→Flux2Pipeline,按逗号拆开
  # 喂多图)已随自建图像引擎删除,当前没有节点解析这个逗号串格式,产出原样透传。需要专用节点
  # 合并的原因仍成立:workflow_executor 单 image 端口接多条边是后到覆盖先到,合并须在上游做。
  image_ref_join:
    label: "参考图合并"
    category: image
    badge: Ref
    badgeColor: "var(--info)"
    inputs:
      - { id: image_a, type: image, label: 参考图 A }
      - { id: image_b, type: image, label: 参考图 B }
    outputs:
      - { id: image, type: image, label: 图像 }
    widgets: []

  # 图像对比(A/B 滑动对比)—— 显示型节点(像 image_output 是 sink,无输出)。前端自定义组件
  # ImageCompareNode 渲染:两路上游 image 叠加 + 可拖竖直分隔线,左露 A 右露 B。inline 节点
  # (executor 是 no-op:对比纯前端,从两个上游 node_complete 的 image_url 取图)。对标 rgthree Image Comparer。
  image_compare:
    label: "图像对比"
    category: image
    badge: Compare
    badgeColor: "var(--info)"
    inputs:
      - { id: image_a, type: image, label: 图像 A }
      - { id: image_b, type: image, label: 图像 B }
    outputs: []
    widgets: []
