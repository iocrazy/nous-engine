name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    # 全局只用 PostgreSQL(2026-09-02):测试不再跑 sqlite,而是每次建一个临时 PG 库
    # (tests/conftest.py 需要 CREATEDB 权限;官方镜像的 POSTGRES_USER 是超级用户,自带)。
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nous
          POSTGRES_PASSWORD: nous
          POSTGRES_DB: nous_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nous"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync deps
        # vllm + modelscope now live in [project.optional-dependencies].inference
        # (see backend/pyproject.toml). API server code does NOT import them,
        # so CI test venv stays small. Integration tests that genuinely need
        # vllm are in the ignore list below.
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Tests
        # CI runners have no GPU, so the heavy torch/vllm stubs in conftest.py
        # are enough — no need for --forked (which OOMs on a 7GB runner when
        # spawning ~286 subprocesses). Integration smoke needs a live vLLM.
        # `--tb=short -rfE` ensures failure summary prints even if pytest exits
        # with non-zero; `--maxfail=50` prevents one broken file from hiding
        # the rest of the report.
        #
        # review T2:test_workers / test_ws_tts 实测不需要 GPU(celery 注册断言 / TestClient
        # WS),已从 ignore 移出纳入门禁。
        # review T3:加 --cov 只报告覆盖率(暂不设阈值门槛),让盲区可见。
        # 2026-09-02:-n auto(pytest-xdist)并行。每个 worker 自建一个 nous_test_<worker>_<hex>
        # 临时 PG 库,互不干扰;runner 2–4 核所以 auto 不会撑爆 PG 的 max_connections。
        # 2026-09-02(事故后):test_vllm_adapter 从 ignore 移出 —— 它不需要 vllm(adapter
        # 只拼命令行),唯一真起子进程的用例已改假 Popen,conftest 另有 Popen 护栏。以前
        # 只靠这里的 --ignore 挡,本地裸跑 `pytest tests` 就真起 vLLM 把 3090 驱动跑挂了。
        # 剩下两个 ignore 待复核(看着不需要 GPU),另开 PR。
        run: |
          uv run pytest -rfE --tb=short --maxfail=50 -p no:cacheprovider \
            -n auto \
            --cov=src --cov-report=term-missing:skip-covered \
            --ignore=tests/test_integration_smoke.py \
            --ignore=tests/test_tts_engine_adapter.py
        env:
          # conftest 会基于这个 URL 建 nous_test_<随机> 临时库,跑完 DROP —— 这里只是基准
          DATABASE_URL: "postgresql+asyncpg://nous:nous@localhost:5432/nous_ci"
          REDIS_URL: "redis://localhost:6379/0"
          CUDA_VISIBLE_DEVICES: ""

      - name: Type check (pyright, non-blocking)
        # review C1:CI 原先无任何 Python 类型检查。pyright 当下对 src 会报存量类型问题
        # (如 Response.body 的 bytes|memoryview),一次性清完超出本 PR 范围 → 先以
        # continue-on-error 接入,让类型错误在 CI 日志里可见、可逐步收敛,不阻断门禁。
        continue-on-error: true
        run: uvx pyright src/api src/services src/utils

  frontend:
    name: Frontend · lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 24 = 当前 LTS。20 已 EOL,且 jsdom 30 / vitest 5 / undici 8 的 engines 都要求 ≥22
          # (undici 8 直接 require('node:worker_threads').markAsUncloneable,22.10 才有;#734 在
          # Node 20 上就是这么炸的:0 个测试收集到)。tests/test_ci_node_version.py 锁住这里与
          # package-lock 里 engines 的关系,下次依赖再抬门槛本地就红。
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust (for wasm-pack)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      # wasm 产物只挂在 `prebuild`(即 `npm run build` 之前),而本 job 的顺序是
      # Lint → Test → Build —— vitest 跑在产物生成**之前**,于是 import 了
      # src/wasm/index.ts 的用例(NodeEditorOverlay.test.tsx)整个文件加载失败:
      #   Failed to resolve import "./pkg/audio_engine.js" from "src/wasm/index.ts"
      # 之前一直被 lint 步骤先挂掩盖着,lint 修绿后才露出来。显式先建一次。
      - name: Build wasm (vitest 需要 src/wasm/pkg 已存在)
        run: npm run wasm:build

      # vitest 之前没进 CI(job 只跑 lint+build)→ 前端单测红了没人察觉
      # (CachedHint.test 在 master 长红到 #409 才修)。接进来当门禁。
      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build
