name: Deploy

# 生产自动上线(2026-09-27):master 上 CI 跑绿 → 生产机本机的 self-hosted runner 跑
# 闸门(infra/autodeploy-guard.sh)+ infra/deploy.sh + 校验生产 HEAD。取代「Mac 上 ship.sh」
# 作为主路径(ship.sh 仍在,作手动兜底)。
#
# 安全(仓库是 public):
#   - 本 workflow 只吃 workflow_run(CI 在 master 的 push 上完成)+ workflow_dispatch,
#     **不吃 pull_request**。
#   - 真正的硬闸在 runner 本机:job-started hook(infra/runner/job-started-guard.sh,装在仓库
#     之外)只放行「本文件 @ refs/heads/master」+ workflow_run/workflow_dispatch。fork PR 自带的
#     workflow 即使被误批准,在 hook 这一步就失败,一行代码都不跑。
#   - runner 用 --no-default-labels,只有专属 label nous-engine-prod —— `runs-on: self-hosted`
#     落不到它;本文件也因此只能写 `runs-on: [nous-engine-prod]`。
#
# 闸门拒绝(自动上线开关关着 / ComfyUI 渲染进行中)→ job 标红并说明原因,代码已在 master,
# 稍后 `gh workflow run deploy.yml` 或 Actions 页手动 Run workflow 重试。

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# 串行,不取消:取消一个跑到一半的 deploy.sh 比多跑一次更危险。
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # 只写专属 label:runner 以 --no-default-labels 注册,没有 self-hosted/Linux/X64 这些默认
    # label —— 写 [self-hosted, nous-engine-prod] 会永远排队(2026-09-27 首跑踩到)。
    runs-on: [nous-engine-prod]
    timeout-minutes: 45
    env:
      PROD: /media/heygo/program/projects-code/repos/nous-engine
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # 只为拿到「正在被上线那一版」的 guard/deploy.sh(与 ship.sh 同理:不执行生产检出里
      # 磁盘上那份旧脚本 —— 它跑到一半 reset --hard 会把自己换掉)。
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: master 已前进则跳过
        id: stale
        run: |
          git -C "$PROD" fetch -q origin master
          latest="$(git -C "$PROD" rev-parse origin/master)"
          if [[ "$latest" != "$SHA" ]]; then
            echo "master 已前进到 ${latest:0:12},本次 ${SHA:0:12} 跳过 —— 新提交的 CI 完成后会部署最新。"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 已被手动部署(生产机上直接 ./infra/deploy.sh)完整上线过 → 不再重启一次(2026-09-27:
          # #766 合并 36s 后有人手动 deploy,master CI 跑完这里又重启一遍,模型白卸载重载)。
          # 「完整」要四条同时成立,否则照常部署:同步到 SHA 之后后端重启过、前端 dist 重建过、
          # 且 /healthz 200 —— 只 reset 了代码但 build/重启失败的半截状态不能被这里跳过掩盖。
          head="$(git -C "$PROD" rev-parse HEAD)"
          synced_at="$(git -C "$PROD" reflog -1 --format=%ct HEAD)"
          started_at="$(date -d "$(systemctl show -p ActiveEnterTimestamp --value nous-engine-backend)" +%s 2>/dev/null || echo 0)"
          dist_at="$(stat -c %Y "$PROD/frontend/dist/index.html" 2>/dev/null || echo 0)"
          health="$(curl -s -o /dev/null -w '%{http_code}' --noproxy '*' --max-time 5 http://127.0.0.1:8000/healthz || echo 000)"
          if [[ "$head" == "$SHA" && "$started_at" -gt "$synced_at" && "$dist_at" -gt "$synced_at" && "$health" == "200" ]]; then
            echo "生产已在 ${SHA:0:12} 且完整上线过(同步后后端重启 + dist 重建 + healthz 200),跳过,不再重启。"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "### ✅ ${SHA:0:12} 已由手动部署上线,本次跳过" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上线前闸门
        if: steps.stale.outputs.skip != '1'
        run: |
          cd "$PROD"
          set +e
          out="$(bash "$GITHUB_WORKSPACE/infra/autodeploy-guard.sh" 2>&1)"; rc=$?
          set -e
          echo "$out"
          if [[ $rc -ne 0 ]]; then
            echo "::error::闸门拒绝上线:$out  —— 代码已在 master;稍后 gh workflow run deploy.yml 重试。"
            { echo "### ⏸ 未上线"; echo; echo "$out"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 上线(deploy.sh)
        if: steps.stale.outputs.skip != '1'
        run: |
          # 与 ship.sh 相同:把本版 deploy.sh 落到生产检出 infra/ 下再执行(BASH_SOURCE 算出的
          # REPO 才对;未跟踪文件不触发脏树守卫,reset --hard 也不碰它;跑完删)。
          cp "$GITHUB_WORKSPACE/infra/deploy.sh" "$PROD/infra/.ship-deploy.sh"
          chmod +x "$PROD/infra/.ship-deploy.sh"
          cd "$PROD"
          set +e
          ./infra/.ship-deploy.sh; rc=$?
          set -e
          rm -f "$PROD/infra/.ship-deploy.sh"
          exit $rc

      - name: 校验生产 HEAD 含本次提交
        if: steps.stale.outputs.skip != '1'
        run: |
          git -C "$PROD" merge-base --is-ancestor "$SHA" HEAD \
            || { echo "::error::deploy.sh 报成功,但生产 HEAD 不含 ${SHA:0:12}"; exit 1; }
          echo "### 🚀 已上线 ${SHA:0:12}" >> "$GITHUB_STEP_SUMMARY"
