# 依赖安全扫描 / 版本更新(review C1:CI 原先无 dependabot / CodeQL / pip-audit)。
# 每周开 PR 更新有漏洞或过期的依赖。这是开公网隧道的推理服务,依赖漏洞可见性值得补。
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # 只对生产依赖分组开 PR;inference extra(vllm/torch pin)手动管理,避免自动 bump 破坏
    # 钉死的 diffusers commit。
    #
    # 上面这句话一直只是注释,没有对应的 ignore —— 于是 dependabot 每周照旧提 torchvision,
    # 而它**永远合不了**:vllm>=0.28.0 依赖 torchvision==0.28.0,nous-center[image] 若要
    # 0.29.0,image 与 inference 两个 extra 就互斥,uv 直接报 unsatisfiable(#620 关于此)。
    # 这一组必须整体一起升(换 vLLM 版本时手动做),所以在这里显式忽略。
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "torchaudio"
      - dependency-name: "vllm"
      - dependency-name: "diffusers"      # 钉死在某个 commit,升级要先跑 smoke_image_ab.py 比 SSIM
      - dependency-name: "transformers"   # 与 vLLM/模型架构强耦合,跟着 vLLM 走
    groups:
      backend-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # typescript 的**主版本**跳跃会顶穿 typescript-eslint 的 peer 范围:8.x 目前是
    # `typescript >=4.8.4 <6.1.0`,而分组 PR 想把 ~5.9.3 抬到 ~7.0.2 → npm ci 直接
    # ERESOLVE,整组 29 个更新一起挂(#677 关于此)。patch/minor 照常跟,主版本等
    # typescript-eslint 支持了再手动升。
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
