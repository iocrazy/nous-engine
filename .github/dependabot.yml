# 依赖安全扫描 / 版本更新(review C1:CI 原先无 dependabot / CodeQL / pip-audit)。
# 每周开 PR 更新有漏洞或过期的依赖。这是开公网隧道的推理服务,依赖漏洞可见性值得补。
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # 只对生产依赖分组开 PR;inference extra(vllm/torch pin)手动管理。
    #
    # torch 一组被 vllm 精确钉死(vllm>=0.28.0 依赖 torchvision==0.28.0 等),dependabot 单独
    # bump 其中一个永远合不了(#620)。这一组必须整体一起升(换 vLLM 版本时手动做),所以在这里
    # 显式忽略。(2026-09-26 image extra 与钉 commit 的 diffusers 随自建图像引擎删除。)
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "torchaudio"
      - dependency-name: "vllm"
      - dependency-name: "transformers"   # 与 vLLM/模型架构强耦合,跟着 vLLM 走
    groups:
      backend-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # typescript 的**主版本**跳跃会顶穿 typescript-eslint 的 peer 范围:8.x 目前是
    # `typescript >=4.8.4 <6.1.0`,而分组 PR 想把 ~5.9.3 抬到 ~7.0.2 → npm ci 直接
    # ERESOLVE,整组 29 个更新一起挂(#677 关于此)。patch/minor 照常跟,主版本等
    # typescript-eslint 支持了再手动升。
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
